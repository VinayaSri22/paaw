services:
  # =============================================================================
  # PAAW Application
  # =============================================================================
  paaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paaw
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://paaw:paaw@postgres:5432/paaw
      - VALKEY_URL=valkey://valkey:6379
      - LOG_LEVEL=INFO
      # Native in-process tools call these services directly (no per-tool MCP
      # container). Service names resolve on the compose network.
      - SEARXNG_URL=http://searxng:8080
      - WHATSAPP_BRIDGE_URL=http://whatsapp:3000
    env_file:
      - .env
    # Run as root so the process can access the mounted docker socket.
    # (Local single-user app; the executor needs to spawn MCP containers.)
    user: root
    volumes:
      - ./configs:/app/configs:ro
      # Mount servers.json read-write so the Server Room UI (enable/disable,
      # add/remove MCP) can persist changes, and so edits apply on restart
      # without rebuilding the image.
      - ./mcp/servers.json:/app/mcp/servers.json
      # Docker-out-of-docker: only needed if you ENABLE a docker-based MCP server
      # in mcp/servers.json. The built-in search + WhatsApp tools are now native
      # (in-process HTTP) and do NOT spawn containers. Safe to remove this mount
      # (and `user: root`) if you don't use any docker-based MCP.
      - /var/run/docker.sock:/var/run/docker.sock
      - paaw-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0

  # =============================================================================
  # PostgreSQL with Apache AGE (Graph Database)
  # Default credentials are for local development only.
  # For production, override via .env or environment variables.
  # =============================================================================
  postgres:
    image: apache/age:latest
    container_name: paaw-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paaw}
      POSTGRES_DB: ${POSTGRES_DB:-paaw}
    volumes:
      # PG18+ uses /var/lib/postgresql with subdirs, not /var/lib/postgresql/data
      - paaw-data:/var/lib/postgresql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - ./scripts/init-graph.sql:/docker-entrypoint-initdb.d/02-init-graph.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paaw -d paaw"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # Valkey (Redis-compatible) - Cache, Pub/Sub, Task Queue
  # =============================================================================
  valkey:
    image: valkey/valkey:8-alpine
    container_name: paaw-valkey
    ports:
      - "6379:6379"
    volumes:
      - paaw-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: valkey-server --appendonly yes

  # =============================================================================
  # WhatsApp Bot (Baileys) - Chat with PAAW via WhatsApp
  # =============================================================================
  whatsapp:
    build:
      context: ./mcp/whatsapp-baileys
      dockerfile: Dockerfile
    # Tag the image so the job executor can spawn the MCP client from it
    image: paaw/whatsapp:latest
    container_name: paaw-whatsapp
    ports:
      # Outbound bridge - lets PAAW jobs/MCP send WhatsApp via the live session
      - "3000:3000"
    environment:
      - PAAW_URL=http://paaw:8080
      - HTTP_PORT=3000
      # Mode: 'self_chat' (Note-to-Self), 'group' (dedicated solo group on your
      #       number), or 'dedicated' (separate number, responds to your number).
      - WHATSAPP_MODE=${WHATSAPP_MODE:-self_chat}
      # Owner identity overrides.
      # self_chat mode: optional - auto-detected (OWNER_LID helps if detection misses).
      # dedicated mode: OWNER_NUMBER is REQUIRED = your personal number (country code, no +).
      # OWNER_NUMBER e.g. 918555934326   |   OWNER_LID e.g. 226589623238805
      - OWNER_NUMBER=${OWNER_NUMBER:-}
      - OWNER_LID=${OWNER_LID:-}
      # Group mode: the group to talk in (default name "PAAW"). Set PAAW_GROUP_JID
      # to pin an exact group id (e.g. 12036...@g.us) if name matching is ambiguous.
      - PAAW_GROUP_NAME=${PAAW_GROUP_NAME:-PAAW}
      - PAAW_GROUP_JID=${PAAW_GROUP_JID:-}
    volumes:
      - ./mcp/whatsapp-baileys/auth:/app/auth
    depends_on:
      - paaw
    restart: unless-stopped
    # Keep running to maintain WhatsApp connection
    tty: true
    stdin_open: true

  # =============================================================================
  # SearXNG - Privacy-respecting meta search engine (no API keys needed!)
  # =============================================================================
  searxng:
    image: searxng/searxng:latest
    container_name: paaw-searxng
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
    volumes:
      - ./configs/searxng:/etc/searxng:rw
    restart: unless-stopped

# =============================================================================
# Volumes
# =============================================================================
volumes:
  paaw-data:
    name: paaw-postgres-data
  paaw-valkey:
    name: paaw-valkey-data
  paaw-logs:
    name: paaw-logs
